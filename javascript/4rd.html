
 <div id="container">

    <img src="images/sale.png">
    <ul>
        <li>
            <label for="oPrice">원래 가격</label>
            <input type="text" id="oPrice">원
        </li>
        <li>
            <label for="rate">할인율</label>
            <input type="text" id="rate">%
        </li>
        <li>
            <button onclick="showAlert()">할인 가격 계산하기</button>
        </li>
        <li>
            <div id="showResult"></div>
        </li>
    </ul>
</div>

<script>
function showAlert() {
    var originalPrice = document.getElementById("oPrice").value;
    var rate = document.querySelector("#rate").value;
    var savedAmount = originalPrice * (rate / 100);
    var result = originalPrice - savedAmount;

    document.querySelector("#showResult").innerHTML =
        "상품의 원래 가격은 " + originalPrice + "원이고, 할인율은 " + rate + "%입니다. " +
        savedAmount + "원을 절약하여 " + result + "원에 살 수 있습니다.";
}
</script>
</body>
</html>
