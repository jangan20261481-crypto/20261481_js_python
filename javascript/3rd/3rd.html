<body>
    <h1>나이를 알려드립니다.</h1>
     <script>
        var year = prompt("출생년도를 입력하세요.");
        var age = 2026 - year + 1;

        document.write("<b><big>" + year + "년생</big></b>은 ");
        document.write("<b><big>" + age + "살</big></b>입니다.");
    </script>
